<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reading Plan</title>
<meta name="theme-color" content="#1b1916">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Reading Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" media="print" onload="this.media='all'">
<style>
/* Built for desktop first (Kyle's main screen), still fine on a phone.
   Warm dark, serif for readings and headings, Inter for everything else (his
   pick, option A of the 2026-11-08 mockups). Gold = buttons and progress;
   brown = the plan's days (it stands out more, his call); plain = the optional
   (*) readings. */
:root{
  --bg:#1b1916; --surface:#23201c; --surface-2:#2c2823; --line:#3a352e; --line-soft:#2a2621;
  --ink:#ece6dc; --ink-2:#bdb3a4; --ink-3:#8c8274;
  --accent:#d6a756; --accent-ink:#1b1505; --accent-soft:#3a2f1c;
  --day:#b39470; --day-dim:#8f7a60;   /* brown, for the plan's days */
  --warn:#e8ab4f; --warn-soft:#382b15; --bad:#ec8a76;
  --head:"Source Serif 4",Georgia,serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
a.rd:hover,a.big-rd:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.app{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font:700 21px/1 var(--head)}
.top-r{display:flex;align-items:center;gap:10px}
.screen{display:grid;gap:22px;align-content:start;padding-top:8px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 18px;border-radius:999px;color:var(--ink-2);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .25)}
.seg.small button{padding:4px 12px;font-size:12.5px}
.sync{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.sync.bad{background:var(--surface-2);color:var(--bad)}
.empty{color:var(--ink-3);text-align:center;padding:40px 0}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 6px}
.star{color:var(--ink-2);font-weight:700}

/* progress */
.prog{display:grid;gap:7px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.prog-top b{font:700 28px/1.1 var(--head);font-variant-numeric:tabular-nums}
.prog-top span{font-size:13.5px;color:var(--ink-3)}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}

/* Next: the card and its lists; two columns on a wide screen */
.cols{display:grid;gap:22px;align-items:start}
.col{display:grid;gap:22px;min-width:0}
@media (min-width:900px){.cols{grid-template-columns:1.25fr 1fr;gap:32px}}
.next{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:20px 22px;display:grid;gap:10px}
.next > *{min-width:0}
.kicker{font-size:12.5px;color:var(--ink-3);font-weight:600;line-height:1.35}
.dayno{font:700 13px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.big-rd{font:700 38px/1.1 var(--head);text-decoration:none;display:inline-flex;align-items:baseline;column-gap:12px;flex-wrap:wrap}
.go{font:600 13px var(--body);color:var(--accent);white-space:nowrap}
.theme{margin:0;color:var(--ink-2);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{border:0;border-radius:12px;height:50px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);margin-top:6px}
.mark:hover{filter:brightness(1.06)}
.done-all{text-align:center;padding:28px 10px;display:grid;gap:6px}
.done-all b{font:700 30px/1.15 var(--head)}

/* reading rows. Stacked (phone, and the side lists on Next):
     o  Day 14  Gen 25; 27            Nov 8
        Jacob and Esau; election
   One line on a wide screen in Plan (.wide):
     o  Day 14  Gen 25; 27   Jacob and Esau; election   Nov 8 */
.list{list-style:none;margin:0;padding:0;display:grid}
.it{display:grid;grid-template-columns:30px auto 1fr auto;grid-template-areas:"tick dn rd when" "tick . th th";column-gap:10px;row-gap:1px;align-items:baseline;padding:9px 8px;border-radius:10px;border-bottom:1px solid var(--line-soft)}
.it:last-child{border-bottom:0}
/* plan days: brown passage, brown circle, brown fill when read */
.tick{grid-area:tick;align-self:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--day-dim);background:none;color:transparent;font-size:13px;font-weight:700;line-height:1;padding:0}
.tick:hover{border-color:var(--day)}
.tick[aria-pressed="true"]{background:var(--day);border-color:var(--day);color:var(--bg)}
.dn{grid-area:dn;font:600 13px var(--body);color:var(--ink-3);min-width:48px;white-space:nowrap}
.rd{grid-area:rd;font:600 16px/1.3 var(--head);text-decoration:none;min-width:0;color:var(--day)}
.th{grid-area:th;font-size:13.5px;color:var(--day-dim);line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* one line, always; full text on hover */
.when{grid-area:when;font-size:12px;color:var(--ink-3);white-space:nowrap;text-align:right}
.it.next-row{background:var(--accent-soft)}
.it.next-row .tick{border-color:var(--accent)}
@media (min-width:760px){
  .list.wide .it{grid-template-columns:30px 64px minmax(170px,280px) 1fr 76px;grid-template-areas:"tick dn rd th when";align-items:center}
}
/* optional (*) readings: no day number, plain text, grey circle */
.it.opt .rd{color:var(--ink-2)}
.it.opt .th{color:var(--ink-3)}
.it.opt .tick{border-color:#5b544a}
.it.opt .tick:hover{border-color:var(--ink-3)}
.it.opt .tick[aria-pressed="true"]{background:var(--ink-3);border-color:var(--ink-3);color:var(--bg)}

/* Plan: one collapsible card per group */
.planbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:13px;color:var(--ink-3)}
.grp{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grp-h{width:100%;border:0;background:var(--surface);text-align:left;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
.grp-h:hover{background:var(--surface-2)}
.grp-h .t{font:700 18px/1.3 var(--head)}
.grp-h .n{color:var(--ink-3);margin-right:8px}
.grp-h .c{font-size:14px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.grp-h .c.full{color:var(--accent)}
.grp-h .books{font-size:13px;color:var(--ink-2);line-height:1.45}   /* the books in this group, in Bible order */
.grp-h .days{font-size:12.5px;color:var(--ink-3);text-align:right;white-space:nowrap;align-self:start}
.grp-h .bar{height:4px;grid-column:1 / -1;margin-top:4px}
.grp-b{padding:4px 10px 10px}
details.about{border-top:1px solid var(--line);padding-top:14px;color:var(--ink-2);font-size:14px;max-width:85ch}
details.about summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
details.about p{margin:10px 0 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgb(0 0 0 / .4);max-width:calc(100vw - 28px)}
.toast[hidden]{display:none}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{border:0;background:var(--bg);color:var(--accent);border-radius:10px;padding:7px 12px;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="top"></div>
  <div class="screen" id="screen"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* The plan itself is plan.json (built from plan.md by tools/build_plan.py).
   Check marks live in a Google Sheet behind an Apps Script web app
   (apps-script/ in the repo). This page keeps a copy in localStorage so it opens
   instantly and works offline; changes queue up and are sent when there is a
   connection. With no API set, check marks stay on this device only. */
const API = "https://script.google.com/macros/s/AKfycbzzRbPGyNyGCCyjqh2poPMRuw1yAwJprIpi_GyINF_6cZPWsfzJ7KSz6iIcGDBNTeQZ/exec";

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let DONE = store.get("esv:done", null);           // {id: "yyyy-mm-dd"} as the Sheet last sent it, plus local changes
let PENDING = store.get("esv:pending", []);       // [{op, id, date, reading}] not yet acknowledged
let PLAN = null;
let syncState = "ok";                             // ok, offline or error
const ui = { tab:"next", sup:store.get("esv:sup", true), open:null, scrolled:false };

/* ---------- small helpers ---------- */
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad = n => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmt = s => { const [y, m, d] = s.split("-").map(Number); return `${MON[m - 1]} ${d}` + (y !== new Date().getFullYear() ? `, ${y}` : ""); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
const esvUrl = q => "https://www.esv.org/" + encodeURI(q.replace(/; /g, ";").replace(/ /g, "+")) + "/";

/* ---------- the model, built once from plan.json ---------- */
let M;
function model() {
  const items = [], byId = {}, days = [];
  PLAN.groups.forEach(g => {
    let last = null;
    g.items.forEach(it => {
      const x = { ...it, g, after:null };
      if (x.day) { last = x; days.push(x); } else x.after = last;   // a supplement follows the day before it
      items.push(x); byId[x.id] = x;
    });
  });
  days.sort((a, b) => a.day - b.day);
  const supsOf = {};
  items.forEach(x => { if (!x.day && x.after) (supsOf[x.after.id] ||= []).push(x); });
  M = { items, byId, days, supsOf, nSup:items.length - days.length };
}
const isDone = id => !!DONE[id];
const nextDay = () => M.days.find(d => !isDone(d.id)) || null;

/* ---------- changes and sync ---------- */
function applyLocal(op) {
  if (op.op === "del") delete DONE[op.id]; else DONE[op.id] = op.date;
}
function change(op) {
  PENDING = PENDING.filter(p => p.id !== op.id);   // one op per reading
  PENDING.push(op);
  applyLocal(op);
  store.set("esv:pending", PENDING); store.set("esv:done", DONE);
  render(); clearTimeout(change.t); change.t = setTimeout(sync, 700);
}
function toggle(id) {
  const x = M.byId[id]; if (!x) return;
  const was = DONE[id];
  change(was ? { op:"del", id } : { op:"set", id, date:today(), reading:(x.day ? `Day ${x.day}: ` : "* ") + x.label });
  if (!was) toast(`${x.day ? "Day " + x.day : x.label} marked read`, () => change({ op:"del", id }));
  else toast(null);
}
let busy = false;
async function sync() {
  if (!API || busy) return;
  busy = true;
  const sent = PENDING.slice();
  try {
    const r = sent.length
      ? await fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify({ ops:sent }) })
      : await fetch(API + "?t=" + Date.now());
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "not ok");
    PENDING = PENDING.filter(p => !sent.includes(p));   // anything changed meanwhile stays queued
    store.set("esv:pending", PENDING);
    DONE = Object.fromEntries(j.done.map(d => [d.id, d.date || today()]));
    PENDING.forEach(applyLocal);
    store.set("esv:done", DONE);
    syncState = "ok";
  } catch (err) {
    syncState = navigator.onLine ? "error" : "offline";
    // first visit on this device and no Sheet: show the plan anyway; anything
    // marked now stays queued and is merged in once the Sheet answers
    if (!DONE) DONE = {};
  }
  busy = false;
  render();
  if (PENDING.length && syncState === "ok") sync();
}
["online", "focus", "pageshow"].forEach(ev => addEventListener(ev, sync));
document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
setInterval(() => { if (!document.hidden) sync(); }, 120000);

/* ---------- pieces ---------- */
// one reading: ✓, "Day 14" (blank for a brown optional reading), the passage
// linked to esv.org, its theme, and the date it was marked read
function row(x, extra = "") {
  const done = isDone(x.id), label = x.day ? `Day ${x.day}` : x.label;
  return `<li class="it${x.day ? "" : " opt"}${done ? " done" : ""}${extra}" id="r-${esc(x.id)}">
    <button class="tick" data-act="tick" data-id="${esc(x.id)}" aria-pressed="${done}" aria-label="${done ? "Un-mark" : "Mark"} ${esc(label)} read">✓</button>
    <span class="dn">${x.day ? "Day " + x.day : ""}</span>
    <a class="rd" href="${esvUrl(x.q)}" target="_blank" rel="noopener">${esc(x.label)}</a>
    <span class="th" title="${esc(tip(x))}">${esc(x.theme)}</span>
    <span class="when">${done ? fmt(DONE[x.id]) : ""}</span></li>`;
}
// hover text for a theme: the theme itself, then the first draft's note
// (its WCF references and cross-references), which the app keeps out of sight
const tip = x => x.note && x.note !== x.theme ? `${x.theme}\n\nOriginal note: ${x.note}` : x.theme;
const list = (xs, wide) => `<ol class="list${wide ? " wide" : ""}">${xs.join("")}</ol>`;
const STAR = `<span class="star">*</span>`;
function progress() {
  const d = M.days.filter(x => isDone(x.id)).length, s = M.items.filter(x => !x.day && isDone(x.id)).length;
  const nx = nextDay();
  return `<div class="prog"><div class="prog-top"><b>${nx ? `Day ${nx.day} of 365` : "Finished"}</b>
    <span>${d} of 365 read${ui.sup ? ` · ${s} of ${M.nSup} ${STAR}` : ""}</span></div>
    <div class="bar"><i style="width:${(d / 365 * 100).toFixed(1)}%"></i></div></div>`;
}

/* ---------- Next: the first unread day and its * readings (left), what follows (right) ---------- */
function vNext() {
  const nx = nextDay();
  if (!nx) return progress() + `<div class="done-all"><b>You've read the whole plan</b><span class="th">All 365 days are marked read.</span></div>`;
  let left = "";
  // * readings left open on the day just before, so marking a day first doesn't hide them
  const prev = M.days.find(d => d.day === nx.day - 1);
  const leftover = ui.sup && prev ? (M.supsOf[prev.id] || []).filter(x => !isDone(x.id)) : [];
  if (leftover.length) left += `<section><p class="label">${STAR} Still open from Day ${prev.day}</p>${list(leftover.map(x => row(x)))}</section>`;
  left += `<section class="next">
    <div class="kicker">Group ${nx.g.n} · ${esc(nx.g.title)}</div>
    <div class="dayno">Day ${nx.day}</div>
    <a class="big-rd" href="${esvUrl(nx.q)}" target="_blank" rel="noopener">${esc(nx.label)}<span class="go">Read in ESV ↗</span></a>
    <p class="theme" title="${esc(tip(nx))}">${esc(nx.theme)}</p>
    <button class="mark" data-act="tick" data-id="${nx.id}">✓ Mark Day ${nx.day} read</button></section>`;
  const sups = ui.sup ? M.supsOf[nx.id] || [] : [];
  if (sups.length) left += `<section><p class="label">${STAR} With this day</p>${list(sups.map(x => row(x)))}</section>`;
  const soon = M.days.filter(d => d.day > nx.day && !isDone(d.id)).slice(0, 5);
  const right = soon.length ? `<section><p class="label">Coming up</p>${list(soon.map(x => row(x)))}</section>` : "";
  return progress() + `<div class="cols"><div class="col">${left}</div><div class="col">${right}</div></div>`;
}

/* ---------- Plan: every group, the one holding the next day open ---------- */
function vPlan() {
  const nx = nextDay();
  if (!ui.open) ui.open = new Set([nx ? nx.g.n : 1]);
  const groups = PLAN.groups.map(g => {
    const its = M.items.filter(x => x.g === g), ds = its.filter(x => x.day), n = ds.filter(x => isDone(x.id)).length;
    const open = ui.open.has(g.n);
    const shown = ui.sup ? its : ds;
    return `<section class="grp"><button class="grp-h" data-act="grp" data-v="${g.n}" aria-expanded="${open}">
        <span class="t"><span class="n">${g.n}</span>${esc(g.title)}</span>
        <span class="c${n === ds.length ? " full" : ""}">${n === ds.length ? "✓ " : ""}${n}/${ds.length}</span>
        <span class="books">${(ui.sup ? g.books : g.dayBooks).map(esc).join(" · ")}</span>
        <span class="days">Days ${g.from}–${g.to}</span>
        <span class="bar"><i style="width:${(n / ds.length * 100).toFixed(1)}%"></i></span></button>
      ${open ? `<div class="grp-b">${list(shown.map(x => row(x, nx && x.id === nx.id ? " next-row" : "")), true)}</div>` : ""}</section>`;
  }).join("");
  return progress() + `<div class="planbar"><div class="seg small" role="group" aria-label="Optional (*) readings">
      <button data-act="sup" data-v="1" aria-pressed="${ui.sup}">Show</button><button data-act="sup" data-v="0" aria-pressed="${!ui.sup}">Hide</button></div></div>`
    + groups
    + `<details class="about"><summary>About this plan</summary>${PLAN.about.map(p => `<p>${md(p)}</p>`).join("")}</details>`;
}

/* ---------- render ---------- */
const $top = document.getElementById("top"), $screen = document.getElementById("screen");
function render() {
  const waiting = PENDING.length ? ` · ${PENDING.length} to save` : "";
  const badge = syncState === "offline" ? `<span class="sync">Offline${waiting}</span>`
    : syncState === "error" ? `<span class="sync bad">Couldn't reach the Sheet${waiting}</span>` : "";
  $top.innerHTML = `<span class="brand">Reading Plan</span><div class="top-r">${badge}<div class="seg" role="group"><button data-act="tab" data-v="next" aria-pressed="${ui.tab === "next"}">Next</button><button data-act="tab" data-v="plan" aria-pressed="${ui.tab === "plan"}">Plan</button></div></div>`;
  if (!PLAN || !DONE) {
    $screen.innerHTML = `<p class="empty">${PLAN === false ? "Couldn't load the plan. Check your connection." : "Loading…"}</p>`;
    return;
  }
  $screen.innerHTML = ui.tab === "plan" ? vPlan() : vNext();
  // first time on Plan: bring the next day into view
  if (ui.tab === "plan" && !ui.scrolled) {
    ui.scrolled = true;
    const nx = nextDay(), el = nx && document.getElementById("r-" + nx.id);
    if (el) el.scrollIntoView({ block:"center" });
  }
}
function go(tab) { ui.tab = tab; ui.scrolled = false; scrollTo(0, 0); toast(null); render(); }

/* toast with Undo after marking something read */
const $toast = document.getElementById("toast");
function toast(text, undo) {
  clearTimeout(toast.t);
  if (!text) { $toast.hidden = true; return; }
  $toast.innerHTML = `<span>${esc(text)}</span><button type="button">Undo</button>`;
  $toast.querySelector("button").onclick = () => { toast(null); undo(); };
  $toast.hidden = false;
  toast.t = setTimeout(() => { $toast.hidden = true; }, 6000);
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const { act, id, v } = el.dataset;
  switch (act) {
    case "tab": return go(v);
    case "tick": return toggle(id);
    case "sup": ui.sup = v === "1"; store.set("esv:sup", ui.sup); break;
    case "grp": { const n = +v; ui.open.has(n) ? ui.open.delete(n) : ui.open.add(n); break; }
  }
  render();
});

/* swipe sideways to switch tab: a quick stroke, mostly across */
let touch = null;
document.addEventListener("touchstart", ev => {
  touch = ev.touches.length === 1 ? { x:ev.touches[0].clientX, y:ev.touches[0].clientY, t:Date.now() } : null;
}, { passive:true });
document.addEventListener("touchend", ev => {
  if (!touch || !PLAN) return;
  const p = ev.changedTouches[0], dx = p.clientX - touch.x, dy = p.clientY - touch.y, quick = Date.now() - touch.t < 700;
  touch = null;
  if (!quick || Math.abs(dx) < 60 || Math.abs(dx) < 2 * Math.abs(dy)) return;
  if (dx < 0 && ui.tab === "next") go("plan");
  else if (dx > 0 && ui.tab === "plan") go("next");
}, { passive:true });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (!API && !DONE) DONE = {};      // no Sheet yet: start empty on this device
render();
fetch("plan.json").then(r => r.json()).then(p => { PLAN = p; model(); render(); })
  .catch(() => { PLAN = false; render(); });
sync().then(() => { if (!DONE && syncState === "ok") { DONE = {}; render(); } });
</script>
</body>
</html>
