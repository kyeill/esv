<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reading Plan</title>
<meta name="theme-color" content="#1b1916">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Reading Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" media="print" onload="this.media='all'">
<style>
/* Desktop first (Kyle's main screen), still usable on a phone. Warm dark,
   serif for scripture and headings, Inter for everything else.
   Gold = buttons and the selected passage; brown = the plan's days; plain =
   the optional readings; green = verses, gold = notes, blue = sermons. */
:root{
  --bg:#1b1916; --surface:#23201c; --surface-2:#2c2823; --line:#3a352e; --line-soft:#2a2621;
  --ink:#ece6dc; --ink-2:#bdb3a4; --ink-3:#8c8274;
  --accent:#d6a756; --accent-ink:#1b1505; --accent-soft:#3a2f1c;
  --day:#b39470; --day-dim:#8f7a60;
  --note:#d6a756; --verse:#8fbf9a; --sermon:#8fb3d9;
  --warn:#e8ab4f; --warn-soft:#382b15; --bad:#ec8a76;
  --head:"Source Serif 4",Georgia,serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit;text-decoration:none}
.app{max-width:1200px;margin-inline:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(60px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.empty{color:var(--ink-3);font-size:14px;margin:0}
.loading{color:var(--ink-3);text-align:center;padding:60px 0}

/* top: the section dropdown is the heading; Sermons on the right */
.head{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 0 12px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.head > div:first-child{min-width:0;flex:1}
.pick{position:relative;display:inline-block;max-width:100%}
.pick select{appearance:none;-webkit-appearance:none;border:0;background:none;font:700 28px/1.2 var(--head);color:var(--ink);padding:2px 34px 2px 0;cursor:pointer;max-width:100%;text-overflow:ellipsis}
.pick select option{font:500 15px var(--body);background:var(--surface);color:var(--ink)}
.pick::after{content:"▾";position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:18px;pointer-events:none}
.pick:hover::after{color:var(--ink)}
.pick.small select{font:600 15px var(--body);color:var(--ink-2);padding-right:26px;width:min(240px,55vw)}   /* else it is as wide as its longest section name */
.pick.small::after{font-size:14px}
.h-title{font:700 28px/1.2 var(--head)}
.books{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.h-right{display:flex;gap:14px;align-items:center;white-space:nowrap;flex-wrap:wrap}
.meta{font-size:13px;color:var(--ink-3)}
.sermbtn{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 16px;font-weight:600;font-size:14px;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.sermbtn i{width:8px;height:8px;border-radius:50%;background:var(--sermon)}
.sermbtn[aria-pressed=true]{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3)}
.sync{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.sync.bad{background:var(--surface-2);color:var(--bad)}

.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start;padding-top:20px}
@media (max-width:820px){.cols{grid-template-columns:1fr}.desk{position:static!important}}

/* left: the selected passage and its notes */
.desk{position:sticky;top:96px;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:20px 22px;display:grid;gap:16px;min-width:0;align-content:start}
/* desktop: the passage box (notes, sermons) scrolls on its own, beside the list */
@media (min-width:821px){.desk{max-height:calc(100vh - 116px);overflow-y:auto;scrollbar-width:thin}}
.desk > *{min-width:0}
.kicker{font:700 12.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.kicker.opt{color:var(--ink-3)}
.big{font:700 34px/1.1 var(--head);margin-top:4px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.big:hover .lbl{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.go{font:600 13px var(--body);color:var(--accent)}
.theme{margin:0;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.trow{display:flex;gap:10px;align-items:baseline;margin-top:6px}
.trow .tedit{border:0;background:none;padding:0;color:var(--ink-3);font-size:12px;font-weight:600;opacity:0;transition:opacity .15s}
.trow:hover .tedit,.tedit:focus{opacity:1}
@media (hover:none){.trow .tedit{opacity:1}}
.tform{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.tform input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);color:var(--ink);font-size:14.5px;outline:none}
.tform .save{margin-left:0;padding:6px 14px}
.tform .ghost{padding:5px 12px}
.tform .linkbtn{color:var(--ink-3)}
.compose{display:grid;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed=true]{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3)}
.linkbtn{border:0;background:none;color:var(--sermon);font-size:13px;font-weight:600;padding:4px 2px}
.chips .linkbtn{margin-left:auto}
textarea{width:100%;min-height:96px;resize:vertical;border:0;background:none;outline:none;font-size:15px;line-height:1.55}
textarea::placeholder,input::placeholder{color:var(--ink-3)}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;color:var(--ink-3)}
.field input{border:0;background:none;outline:none;width:160px;color:var(--ink);font-size:13.5px}
.save{margin-left:auto;border:0;border-radius:10px;padding:8px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.save:disabled{opacity:.5;cursor:default}
.ghost{border:1px solid var(--line);background:none;border-radius:10px;padding:7px 14px;font-weight:600;color:var(--ink-2)}
.notes-h{font:700 17px var(--head);margin:0}
.notes{display:grid;gap:14px}
.note{border-left:3px solid var(--c);padding:4px 0 4px 12px;display:grid;gap:4px;position:relative}
.note-top{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.note-top .kind{color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:11px}
.note-top .ref{color:var(--ink-2);font-weight:600}
.note-top .vref{color:var(--verse);font-weight:600;font-size:13px}
.note-top .acts{margin-left:auto;display:flex;gap:10px;opacity:0;transition:opacity .15s}
.note:hover .acts,.note:focus-within .acts{opacity:1}
@media (hover:none){.note-top .acts{opacity:1}}
.acts button{border:0;background:none;padding:0;color:var(--ink-3);font-size:12px;font-weight:600}
.acts button:hover{color:var(--ink)}
.note p{margin:0;font-size:14.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.note blockquote{margin:0;font:400 15.5px/1.5 var(--head);font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere}
.note .compose{margin-top:4px}
a.slink{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--sermon);border-radius:10px;padding:10px 12px;background:var(--bg)}
a.slink:hover{border-color:var(--ink-3);border-left-color:var(--sermon)}
.slink b{font:700 16px var(--head)}
.slink small{display:block;font-size:12.5px;color:var(--ink-3)}
.slink .pass{display:block;font-size:12.5px;font-weight:600;color:var(--sermon)}
.slink .arrow{color:var(--sermon);font-weight:700;white-space:nowrap;font-size:13px}

/* passphrase */
.lock{display:grid;gap:10px;border:1px dashed var(--line);border-radius:14px;padding:16px}
.lock b{font:700 16px var(--head)}
.lock p{margin:0;font-size:13.5px;color:var(--ink-2)}
.lock input{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);outline:none;font-size:15px}
.lock .err{color:var(--bad);font-size:13px}

/* right: every passage in the section */
.listbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px;font-size:13px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:999px;color:var(--ink-2);font-weight:600;font-size:12.5px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink)}
ol{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:52px minmax(0,1fr) auto;column-gap:10px;row-gap:1px;grid-template-areas:"dn rd cnt" ". th th";align-items:baseline;padding:8px 10px;border-radius:10px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.it:hover{background:var(--surface)}
.it.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.dn{grid-area:dn;font:600 12.5px var(--body);color:var(--ink-3);white-space:nowrap}
.rd{grid-area:rd;font:600 15.5px/1.3 var(--head);color:var(--day)}
.th{grid-area:th;font-size:13px;color:var(--day-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cnt{grid-area:cnt;font:600 11.5px var(--body);color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:1px 8px;display:inline-flex;gap:4px;align-items:center}
.cnt i{width:6px;height:6px;border-radius:50%;background:var(--note)}
.opt .rd{color:var(--ink-2)}
.opt .th{color:var(--ink-3)}

/* Sermons page */
.sgrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:28px;align-items:start;padding-top:20px}
@media (max-width:820px){.sgrid{grid-template-columns:1fr}}
.slist{display:grid;gap:6px;align-content:start}
/* desktop: the sermon list scrolls on its own, beside the sermon */
@media (min-width:821px){.slist{position:sticky;top:84px;max-height:calc(100vh - 150px);overflow-y:auto;padding-right:6px;scrollbar-width:thin}}
.series{border:0;background:none;width:100%;text-align:left;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin:10px 0 0;padding:6px 4px;border-radius:8px;display:flex;gap:8px;align-items:center}
.series:hover{background:var(--surface);color:var(--ink)}
.series span{width:10px;color:var(--ink-3);font-size:12px}
.series em{font-style:normal;margin-left:auto;color:var(--ink-3);letter-spacing:0}
.sitem{border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:2px}
.sitem:hover{background:var(--surface)}
.sitem.sel{background:var(--surface-2);border-color:var(--ink-3)}
.sitem small{font-size:12px;color:var(--ink-3)}
.sitem b{font:700 16px/1.3 var(--head)}
.sitem b.det{color:var(--day)}   /* a sermon with Details (Lead Elder, Easter...) */
.sitem span{font-size:12.5px;color:var(--ink-2)}
.newbtn{border:1px dashed var(--line);background:none;border-radius:12px;padding:10px;color:var(--sermon);font-weight:600}
.sdoc{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:24px 28px;display:grid;gap:18px;min-width:0}
.sdoc-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sdoc h2{margin:0;font:700 30px/1.15 var(--head);color:var(--accent)}
.sdoc .ser{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px;margin:0}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0}
.facts dd a{color:var(--day);font-weight:600}
.facts .on{color:var(--ink-3);font-size:13px}
.summary{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.summary h4,.sec h4{margin:0 0 6px;font:700 16px var(--head)}
.sec h4{color:var(--day)}   /* sermon section titles: brown, like Verses and the day links */
.summary p{margin:0;color:var(--ink-2);white-space:pre-wrap}
.sec ul{margin:0;padding-left:20px;display:grid;gap:5px}
.sec li{line-height:1.55}
.sec .subh{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--day);margin:12px 0 4px}
.sec h4+.subh,.sec .subh:first-child{margin-top:2px}
.sec ul.sub{margin-top:4px;gap:3px;list-style:circle}
.gdiv{display:flex;align-items:center;gap:12px;font:italic 16px var(--head);color:var(--ink-2)}
.gdiv:before,.gdiv:after{content:"";flex:1;border-top:1px solid var(--line)}
.form label .hint{color:var(--ink-3);opacity:.8}
.form{display:grid;gap:12px}
.form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--ink-3)}
.form input,.form textarea{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);font-size:14.5px;outline:none;min-height:0}
.form textarea{min-height:70px}
.cmb{position:relative;display:grid}
.cmb:after{content:"\25BE";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;font-size:12px}
.cmb input{padding-right:26px}
.cmenu{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;margin:0;padding:4px;list-style:none;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;max-height:260px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cmenu li{padding:6px 10px;border-radius:7px;font-size:14px;color:var(--ink);cursor:pointer}
.cmenu li:hover,.cmenu li.on{background:var(--accent-soft)}
.secedit{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.secedit .x{justify-self:end;border:0;background:none;color:var(--ink-3);font-size:12.5px}
.addsec{border:1px dashed var(--line);background:none;border-radius:10px;padding:8px;color:var(--ink-2);font-weight:600}
.danger{border:0;background:none;color:var(--bad);font-weight:600;font-size:13px;margin-right:auto}

/* Phone: the section name gets its own full-width line, with "Days …" and
   Sermons on a line under it; the top bar stops sticking so it doesn't eat the
   screen; the sermon form goes to one field per line. */
@media (max-width:820px){
  .head{position:static;flex-direction:column;align-items:stretch;gap:8px}
  .head > div:first-child{width:100%}
  .pick{display:block}
  .pick select{width:100%;font-size:21px;white-space:normal}
  .pick.small select{width:100%;font-size:15px}
  .h-title{font-size:24px}
  .h-right{justify-content:space-between}
  .h-right .pick.small{flex:1;min-width:0}
  .desk{padding:16px}
  .big{font-size:28px}
  .sdoc{padding:18px 16px}
  .sdoc h2{font-size:24px}
  .form .grid2{grid-template-columns:1fr}
  .row2 .save{margin-left:0}
  .row2:has(.danger) .save{margin-left:auto}
}
/* themes wrap on a phone only; a narrowed desktop window keeps them to one line */
@media (max-width:820px) and (hover:none){.theme,.th{white-space:normal;overflow:visible}}
</style>
</head>
<body>
<div class="app">
  <header class="head" id="head"></header>
  <main id="main"><p class="loading">Loading…</p></main>
</div>

<script>
/* The plan is plan.json (built from plan.md by tools/build_plan.py). Notes and
   sermons live in the Reading Plan Google Sheet behind an Apps Script web app
   (apps-script/ in the repo), which needs the passphrase on every call. This
   page keeps a copy in localStorage, so it opens instantly and works offline;
   changes queue up and are sent when there is a connection. */
const API = "https://script.google.com/macros/s/AKfycbzzRbPGyNyGCCyjqh2poPMRuw1yAwJprIpi_GyINF_6cZPWsfzJ7KSz6iIcGDBNTeQZ/exec";

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let KEY = store.get("esv:key", "");                     // the passphrase on this device
let DATA = store.get("esv:data", null);                 // {notes, sermons} as the Sheet last sent them, plus local changes
let PENDING = store.get("esv:ops", []);                 // changes not yet acknowledged
let PLAN = null;
let syncState = "ok";                                   // ok, offline, error
let lockState = KEY ? "ok" : "unknown";                 // ok, choose (no passphrase yet), enter, unknown
let lockError = "";
// what was on screen last time (this device only)
const ui = {
  view:store.get("esv:view", "section"), g:store.get("esv:g", 0), sel:store.get("esv:sel", null),
  ss:store.get("esv:ss", null), all:store.get("esv:allChapters", false), per:store.get("esv:per", {}),   // per: last passage open in each section
  kind:"verse", editing:null, fresh:null, draft:"", editNote:null, editTheme:null, themeDraft:"",   // fresh: id of a new sermon not saved yet; draft: unsaved note text
};
// "all" is saved as esv:allChapters (default Reading Plan, his call 2026-11-10; the old esv:all is ignored)
const remember = () => { ["view", "g", "sel", "ss", "per"].forEach(k => store.set("esv:" + k, ui[k])); store.set("esv:allChapters", ui.all); };

/* ---------- small helpers ---------- */
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad = n => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmt = s => { if (!s) return ""; const [y, m, d] = s.split("-").map(Number); return `${MON[m - 1]} ${d}, ${y}`; };
const short = s => s ? fmt(s).replace(/, \d+$/, "") : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const esvUrl = q => "https://www.esv.org/" + encodeURI(q.replace(/[–—]/g, "-").replace(/\s*;\s*/g, ";").replace(/ /g, "+")) + "/";
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
// a passage's theme: his own rewrite (Themes tab) if he made one, else the plan's
const themeOf = x => DATA?.themes?.[x.id] || x.theme;
// hover text for a theme: the theme, then the plan's (if rewritten) and the first draft's note
const tip = x => { const t = themeOf(x);
  return [t, t !== x.theme && "Plan's theme: " + x.theme, x.note && x.note !== x.theme && x.note !== t && "Original note: " + x.note].filter(Boolean).join("\n\n"); };

/* ---------- the plan ---------- */
let M;
function model() {
  const items = [], byId = {};
  PLAN.groups.forEach((g, gi) => g.items.forEach(it => { const x = { ...it, gi, sp:spans(it.q) }; items.push(x); byId[x.id] = x; }));
  M = { items, byId };
}
const firstOf = gi => (PLAN.groups[gi].items.find(x => x.day) || PLAN.groups[gi].items[0]).id;

/* Which plan passages a reference falls in, by chapter.
   "1 Pet 4:1–11" -> chapter 4 of 1 Peter; "Luke 9:51–10:42" -> chapters 9-10;
   a one-chapter book with no number ("Jude") is chapter 1. */
const bookName = b => PLAN.bookNames[b.trim().toLowerCase().replace(/\.$/, "")] || b.trim();
// After "Luke 23:1-5" a comma piece ("13-38") is more verses of chapter 23;
// after a whole chapter ("Gen 9") a piece ("11") is another chapter.
function spans(q) {
  let book = null, chapterOfVerses = false;
  const out = [];
  String(q || "").replace(/[–—]/g, "-").split(/\s*;\s*|\s*\+\s*/).filter(Boolean).forEach(seg => {
    seg.split(/\s*,\s*/).filter(Boolean).forEach((p, i) => {
      p = p.trim();
      const m = p.match(/^((?:[1-3]\s?)?[A-Za-z][A-Za-z. ]*?)\s*(\d+)(?::(\d+))?(?:\s*-\s*(\d+)(?::(\d+))?)?$/);
      if (m) {
        book = bookName(m[1]); chapterOfVerses = !!m[3];
        const from = +m[2], to = m[4] && (m[5] || !m[3]) ? +m[4] : from;
        return out.push({ book, from, to });
      }
      const c = p.match(/^(\d+)(?::(\d+))?(?:\s*-\s*(\d+)(?::\d+)?)?$/);
      if (c && book) {
        if (i > 0 && chapterOfVerses && !c[2]) return;          // more verses of the same chapter
        chapterOfVerses = !!c[2];
        return out.push({ book, from:+c[1], to:c[3] && !c[2] ? +c[3] : +c[1] });
      }
      if (/^[1-3]?\s?[A-Za-z]/.test(p)) { book = bookName(p); out.push({ book, from:1, to:1 }); }
    });
  });
  return out;
}
function passagesFor(ref) {
  const want = spans(ref);
  if (!want.length) return [];
  return M.items.filter(x => x.sp.some(a => want.some(b => a.book === b.book && a.from <= b.to && b.from <= a.to)));
}

/* ---------- notes and sermons ---------- */
const notesOf = id => (DATA?.notes || []).filter(n => n.passage === id);
// passage id -> its sermons, oldest first; rebuilt only when the data changes
let SIDX = null;
function sermonsOn(id) {
  if (!SIDX) {
    SIDX = {};
    (DATA?.sermons || []).forEach(s => passagesFor(s.verses).forEach(x => (SIDX[x.id] ||= []).push(s)));
    Object.values(SIDX).forEach(l => l.sort((a, b) => (a.date || "").localeCompare(b.date || "")));
  }
  return SIDX[id] || [];
}
const verseKey = r => { const m = String(r).match(/(\d+):(\d+)/) || String(r).match(/(\d+)/); return m ? +m[1] * 1000 + (+m[2] || 0) : 0; };
const countOn = id => notesOf(id).length + sermonsOn(id).length;
// Sermons page order: series newest first (by their latest sermon); within a
// series oldest first. A sermon with no series is a series of its own.
function sermonGroups() {
  const groups = {};
  (DATA?.sermons || []).forEach(s => { const k = s.series.trim() ? "s:" + s.series.trim().toLowerCase() : "x:" + s.id; (groups[k] ||= []).push(s); });
  return Object.values(groups).map(list => list.sort((a, b) => (a.date || "").localeCompare(b.date || "")))
    .sort((a, b) => (b.at(-1).date || "").localeCompare(a.at(-1).date || ""));
}

/* ---------- changes and sync ---------- */
function applyLocal(op) {
  SIDX = null;
  if (!DATA) DATA = { notes:[], sermons:[], themes:{} };
  const up = (list, obj) => { const i = list.findIndex(x => x.id === obj.id); i >= 0 ? list[i] = obj : list.push(obj); };
  if (op.op === "note") up(DATA.notes, op.note);
  if (op.op === "sermon") up(DATA.sermons, op.sermon);
  if (op.op === "delnote") DATA.notes = DATA.notes.filter(x => x.id !== op.id);
  if (op.op === "delsermon") DATA.sermons = DATA.sermons.filter(x => x.id !== op.id);
  if (op.op === "theme") { DATA.themes ||= {}; if (op.theme) DATA.themes[op.passage] = op.theme; else delete DATA.themes[op.passage]; }
}
const opKey = p => p.op === "theme" ? "t:" + p.passage : (p.note?.id || p.sermon?.id || p.id);
function change(op) {
  PENDING = PENDING.filter(p => opKey(p) !== opKey(op));   // latest change per item wins
  PENDING.push(op);
  applyLocal(op);
  store.set("esv:ops", PENDING); store.set("esv:data", DATA);
  render(); clearTimeout(change.t); change.t = setTimeout(sync, 700);
}
let busy = false;
async function call(body) {
  const r = body
    ? await fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(body) })
    : await fetch(API + "?key=" + encodeURIComponent(KEY) + "&t=" + Date.now());
  return r.json();
}
async function sync() {
  if (busy) return;
  busy = true;
  const sent = PENDING.slice();
  try {
    const j = await call(sent.length || !KEY ? { key:KEY, ops:sent } : null);
    if (!j.ok && (j.error === "no-passphrase" || j.error === "wrong-passphrase")) {
      lockState = j.error === "no-passphrase" ? "choose" : "enter";
      if (KEY && j.error === "wrong-passphrase") { KEY = ""; store.del("esv:key"); lockError = "That passphrase no longer works. Enter the current one."; }
      syncState = "ok";
    } else {
      if (!j.ok) throw new Error(j.error || "not ok");
      lockState = "ok";
      PENDING = PENDING.filter(p => !sent.includes(p));
      store.set("esv:ops", PENDING);
      DATA = { notes:j.notes, sermons:j.sermons, themes:j.themes || {} }; SIDX = null;
      PENDING.forEach(applyLocal);
      store.set("esv:data", DATA);
      syncState = "ok";
    }
  } catch (err) {
    syncState = navigator.onLine ? "error" : "offline";
  }
  busy = false;
  render();
  if (PENDING.length && syncState === "ok" && lockState === "ok") sync();
}
async function unlock(pass, confirm) {
  lockError = "";
  if (lockState === "choose") {
    if (pass.length < 6) { lockError = "Use at least 6 characters."; return render(); }
    if (pass !== confirm) { lockError = "The two don't match."; return render(); }
  }
  try {
    const j = lockState === "choose" ? await call({ claim:pass, ops:[] }) : await (KEY = pass, call(null));
    if (!j.ok) { KEY = ""; lockError = j.error === "wrong-passphrase" ? "That's not the passphrase." : "Couldn't unlock: " + (j.error || "unknown error"); return render(); }
    KEY = pass; store.set("esv:key", KEY);
    lockState = "ok"; DATA = { notes:j.notes, sermons:j.sermons, themes:j.themes || {} }; SIDX = null;
    PENDING.forEach(applyLocal); store.set("esv:data", DATA);
    render(); if (PENDING.length) sync();
  } catch { KEY = ""; lockError = "Couldn't reach the Sheet. Check your connection."; render(); }
}
["online", "focus", "pageshow"].forEach(ev => addEventListener(ev, () => { if (KEY) sync(); }));
document.addEventListener("visibilitychange", () => { if (!document.hidden && KEY) sync(); });
setInterval(() => { if (!document.hidden && KEY) sync(); }, 120000);

/* ---------- a section: the selected passage (left), every passage (right) ---------- */
function noteCard(n) {
  if (ui.editNote === n.id) return `<article class="note" style="--c:var(--${n.kind})">${composer(n)}</article>`;
  // a verse shows just its reference, in green; a note keeps its label and date
  const top = n.kind === "verse" ? `<span class="vref">${esc(n.ref)}</span>`
    : `<span class="kind">${n.kind}</span><span class="ref">${esc(n.ref)}</span>${n.written ? `<span>· ${short(n.written)}</span>` : ""}`;
  return `<article class="note" style="--c:var(--${n.kind})"><div class="note-top">${top}
      <span class="acts"><button data-act="editnote" data-id="${esc(n.id)}">Edit</button><button data-act="delnote" data-id="${esc(n.id)}">Delete</button></span></div>
    ${n.kind === "verse" ? `<blockquote>${esc(n.text)}</blockquote>` : `<p>${esc(n.text)}</p>`}</article>`;
}
function composer(n) {
  const x = M.byId[ui.sel], kind = n ? n.kind : ui.kind;

  return `<div class="compose">
    ${n ? "" : `<div class="chips">
      <button class="chip" data-act="kind" data-v="verse" aria-pressed="${kind === "verse"}"><i style="background:var(--verse)"></i>Verse</button>
      <button class="chip" data-act="kind" data-v="note" aria-pressed="${kind === "note"}"><i style="background:var(--note)"></i>Note</button>

    <textarea id="${n ? "e-text" : "n-text"}" placeholder="${kind === "verse" ? "The verse, or why it stands out" : "Your thoughts on this passage"}">${n ? esc(n.text) : esc(ui.draft || "")}</textarea>
    <div class="row2"><label class="field">${kind === "verse" ? "Verse" : "Passage"} <input id="${n ? "e-ref" : "n-ref"}" value="${esc(ref)}"></label>
      ${n ? `<button class="ghost" data-act="canceledit">Cancel</button><button class="save" data-act="saveedit" data-id="${esc(n.id)}">Save</button>`
          : `<button class="save" data-act="savenote">Save</button>`}</div></div>`;
}
function vLock(where) {

  const choose = lockState === "choose";
  return `<form class="lock" id="lockform">
    <b>${choose ? "Choose a passphrase" : "Enter your passphrase"}</b>
    <p>${choose ? `Your ${where} are kept private in your Google Sheet. Pick a passphrase you'll remember (at least 6 characters). You'll type it once on each device.`

function vSection() {
  const G = PLAN.groups[ui.g];

  if (lockState !== "ok") notesHtml = vLock("notes");
  else {
    const mine = notesOf(ui.sel);
    const v = mine.filter(n => n.kind === "verse").sort((a, b) => verseKey(a.ref) - verseKey(b.ref));
    const n = mine.filter(n => n.kind === "note").sort((a, b) => (a.written || "").localeCompare(b.written || ""));

    const all = [...v.map(noteCard), ...n.map(noteCard), ...s];

            ${DATA?.themes?.[x.id] ? `<button class="linkbtn" data-act="resettheme" title="${esc(x.theme)}">Use the plan's</button>` : ""}</div>`
          : `<div class="trow"><p class="theme" title="${esc(tip(x))}">${esc(themeOf(x))}</p>${lockState === "ok" ? `<button class="tedit" data-act="edittheme">Edit</button>` : ""}</div>`}</div>

        <span class="th" title="${esc(tip(i))}">${esc(themeOf(i))}</span></li>`; }).join("")}</ol>
    </section></div>`;

/* ---------- Sermons page ---------- */
function sermonDoc(s) {
  const on = passagesFor(s.verses);
  return `<article class="sdoc">
    <div class="sdoc-top"><div>${s.series ? `<div class="ser">${esc(s.series)}</div>` : ""}<h2>${esc(s.title || "Untitled sermon")}</h2></div>
      <button class="ghost" data-act="editsermon">Edit</button></div>
    <dl class="facts">${s.date ? `<dt>Date</dt><dd>${fmt(s.date)}</dd>` : ""}
      ${s.pastor ? `<dt>Pastor</dt><dd>${esc(s.pastor)}</dd>` : ""}
      ${s.details ? `<dt>Details</dt><dd>${esc(s.details)}</dd>` : ""}
      ${s.verses ? `<dt>Verses</dt><dd><a href="${esvUrl(s.verses)}" target="_blank" rel="noopener">${esc(s.verses)} ↗</a>
        ${on.length ? `<span class="on"> · shows on ${on.map(x => `<a href="#" data-act="goto" data-id="${esc(x.id)}">${x.day ? "Day " + x.day : esc(x.label)}</a>`).join(", ")}</span>` : `<span class="on"> · not matched to a passage</span>`}</dd>` : ""}</dl>
    ${s.summary ? `<div class="summary"><h4>Summary</h4><p>${esc(s.summary)}</p></div>` : ""}
    ${(s.sections || []).map(secHtml).join("")}
  </article>`;
}
// A section's points: "# x" is a small brown sub-heading, "> x" nests under the
// point above it, and a section with a title but no points is a divider
// between sections (a heading over a group of them).
function secHtml(sec) {
  const pts = sec.points || [];
  if (sec.title && !pts.length) return `<div class="gdiv">${esc(sec.title)}</div>`;
  let out = "", items = [], cur = null;
  const flush = () => {
    if (cur) items.push(cur), cur = null;
    if (items.length) out += `<ul>${items.map(x => `<li>${esc(x.t)}${x.sub.length ? `<ul class="sub">${x.sub.map(y => `<li>${esc(y)}</li>`).join("")}</ul>` : ""}</li>`).join("")}</ul>`;
    items = [];
  };
  for (const p of pts) {
    if (p.startsWith("#")) { flush(); out += `<div class="subh">${esc(p.replace(/^#+\s*/, ""))}</div>`; }
    else if (p.startsWith(">") && cur) cur.sub.push(p.replace(/^>+\s*/, ""));
    else { if (cur) items.push(cur); cur = { t:p.replace(/^>+\s*/, ""), sub:[] }; }
  }
  flush();
  return `<div class="sec">${sec.title ? `<h4>${esc(sec.title)}</h4>` : ""}${out}</div>`;
}
function sermonForm(s) {

    <div class="grid2"><label>Date<input type="date" id="f-date" value="${esc(s.date || "")}"></label>

const secEdit = (n, sec = { title:"", points:[] }) => `<div class="secedit"><label>Section ${n}<input class="f-st" value="${esc(sec.title)}" placeholder="e.g. ${n}. Heading"></label>
  <label>Points, one per line <span class="hint">· start a line with # for a sub-heading, or &gt; to tuck it under the line above · a section with a title and no points becomes a divider</span><textarea class="f-sp">${esc((sec.points || []).join("\n"))}</textarea></label>
  <button class="x" data-act="dropsec">Remove section</button></div>`;
function vSermons() {
  if (lockState !== "ok") return `<div class="sgrid"><div></div>${vLock("sermon notes")}</div>`;
  const groups = sermonGroups(), flat = groups.flat();
  const s = ui.editing || flat.find(x => x.id === ui.ss) || flat[0];
  // Series fold open and shut by their title. All start shut except the
  // newest (and one whose sermon you open). A sermon with no series has no
  // title and is always shown.
  const key = g => g[0].series.trim() ? g[0].series.trim().toLowerCase() : null;
  if (!ui.openSeries) ui.openSeries = new Set(groups.length && key(groups[0]) ? [key(groups[0])] : []);
  const item = x => `<div class="sitem${s && x.id === s.id ? " sel" : ""}" data-act="opensermon" data-id="${esc(x.id)}"><small>${fmt(x.date) || "No date"}</small><b${x.details ? ` class="det"` : ""}>${esc(x.title || "Untitled sermon")}</b>
      <span>${esc(x.verses)}${x.pastor ? " · " + esc(x.pastor) : ""}</span></div>`;
  const list = groups.map(g => {
    const k = key(g);
    if (!k) return g.map(item).join("");
    const open = ui.openSeries.has(k);
    // the years it ran: "(2026)", or "(2024-25)" across a new year
    const ys = g.map(x => +(x.date || "").slice(0, 4)).filter(Boolean), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const years = !ys.length ? "" : y0 === y1 ? ` (${y0})` : ` (${y0}-${String(y1).slice(2)})`;
    return `<button class="series" data-act="series" data-v="${esc(k)}" aria-expanded="${open}"><span>${open ? "▾" : "▸"}</span>${esc(g[0].series)}${years}<em>${g.length}</em></button>` + (open ? g.map(item).join("") : "");
  }).join("");
  return `<div class="sgrid">
    <div class="slist"><button class="newbtn" data-act="newsermon2">+ New sermon</button>${list}</div>
    <div>${ui.editing ? sermonForm(ui.editing) : s ? sermonDoc(s) : `<p class="empty">No sermons yet. Use “+ New sermon”, or “+ Sermon on this passage” from any passage.</p>`}</div></div>`;
}

/* ---------- render ---------- */

  const keep = document.activeElement && ["n-text", "e-text", "e-ref", "n-ref", "pass", "pass2", "t-text"].includes(document.activeElement.id) ? document.activeElement.id : null;
  if (document.getElementById("t-text")) ui.themeDraft = document.getElementById("t-text").value;
  if (document.getElementById("n-text")) ui.draft = ui.view === "section" ? document.getElementById("n-text").value : ui.draft;
  if (document.getElementById("sform")) return;          // never wipe a sermon being edited; it redraws on Save or Cancel
  $head.innerHTML = vHead();
  $main.innerHTML = ui.view === "sermons" ? vSermons() : vSection();
  if (keep && document.getElementById(keep)) document.getElementById(keep).focus();
}
function readSermonForm(s) {

// Leaving a sermon form open asks first, since unsaved edits would be lost.
function go(view, extra = {}) {

  if (form && !confirm("Leave without saving this sermon?")) return false;
  if (form) form.remove();
  Object.assign(ui, { view, editing:null, fresh:null, editNote:null }, extra);
  if (ui.view === "section") ui.per[ui.g] = ui.sel;
  remember(); render(); scrollTo(0, 0);

}
// open a section on the passage last open there (else its first plan day)
const openSection = (g, sel) => go("section", { g, sel:sel || ui.per[g] || firstOf(g), draft:"" });

document.addEventListener("change", ev => {
  if (ev.target.id === "section" && ev.target.value !== "" && !openSection(+ev.target.value)) ev.target.value = ui.view === "sermons" ? "" : ui.g;
});
document.addEventListener("submit", ev => {
  if (ev.target.id !== "lockform") return;
  ev.preventDefault();
  unlock(document.getElementById("pass").value, document.getElementById("pass2")?.value);
});
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const { act, id, v } = el.dataset;
  switch (act) {
    case "pick": ui.sel = id; ui.per[ui.g] = id; ui.editNote = null; ui.editTheme = null; ui.draft = ""; remember(); return render();
    case "edittheme": ui.editTheme = ui.sel; ui.themeDraft = themeOf(M.byId[ui.sel]); render(); { const t = document.getElementById("t-text"); t.focus(); t.select(); } return;
    case "canceltheme": ui.editTheme = null; return render();
    case "savetheme": return saveTheme();
    case "resettheme": ui.editTheme = null; return change({ op:"theme", passage:ui.sel, theme:"" });
    case "all": ui.all = v === "1"; remember(); return render();
    case "kind": ui.kind = v; return render();
    case "sermons": ev.preventDefault(); return ui.view === "sermons" ? openSection(ui.g, ui.sel) : go("sermons");
    case "opensermon": ev.preventDefault(); {
      // opening a sermon (from a passage, or the list) unfolds its series
      const m = (DATA?.sermons || []).find(x => x.id === id);
      if (m?.series.trim()) (ui.openSeries ||= new Set()).add(m.series.trim().toLowerCase());
      return go("sermons", { ss:id }); }
    case "series": ui.openSeries.has(v) ? ui.openSeries.delete(v) : ui.openSeries.add(v); return render();
    case "goto": ev.preventDefault(); return openSection(M.byId[id].gi, id);
    case "savenote": {
      const text = document.getElementById("n-text").value.trim(); if (!text) return;
      ui.draft = ""; document.getElementById("n-text").value = "";
      return change({ op:"note", note:{ id:newId("n"), passage:ui.sel, kind:ui.kind, ref:document.getElementById("n-ref").value.trim(), text, written:today() } });
    }
    case "editnote": ui.editNote = id; return render();
    case "canceledit": ui.editNote = null; return render();
    case "saveedit": {
      const n = DATA.notes.find(x => x.id === id), text = document.getElementById("e-text").value.trim(); if (!n || !text) return;
      ui.editNote = null;
      return change({ op:"note", note:{ ...n, text, ref:document.getElementById("e-ref").value.trim() } });
    }
    case "delnote": if (confirm("Delete this note? This can't be undone.")) change({ op:"delnote", id }); return;
    case "newsermon": case "newsermon2": {
      const verses = act === "newsermon" ? M.byId[ui.sel].label.replace(/ \+ .*/, "") : "";
      const s = { id:newId("s"), date:today(), series:"", title:"", pastor:"", details:"", verses, summary:"", sections:[] };
      return go("sermons", { ss:s.id }) && (ui.editing = s, ui.fresh = s.id, render());
    }
    case "editsermon": { const s = DATA.sermons.find(x => x.id === ui.ss) || sermonGroups().flat()[0]; ui.editing = { ...s }; ui.fresh = null; $head.innerHTML = vHead(); $main.innerHTML = vSermons(); return; }
    case "addsec": { const box = document.getElementById("f-secs"); box.insertAdjacentHTML("beforeend", secEdit(box.children.length + 1)); return; }
    case "dropsec": el.closest(".secedit").remove(); return;
    case "cancelsermon": { const back = ui.fresh === ui.editing?.id ? null : ui.editing?.id; ui.editing = null; ui.fresh = null; ui.ss = back; document.getElementById("sform").remove(); return render(); }
    case "savesermon": {
      const s = readSermonForm(ui.editing);
      if (!s.title && !s.summary && !s.sections.length) { alert("Give the sermon a title, a summary, or a section first."); return; }
      ui.editing = null; ui.fresh = null; ui.ss = s.id; remember();
      document.getElementById("sform").remove();
      return change({ op:"sermon", sermon:s });
    }
    case "delsermon": {
      if (!confirm("Delete this sermon? This can't be undone.")) return;
      const sid = ui.editing.id; ui.editing = null; ui.ss = null;
      document.getElementById("sform").remove();
      return change({ op:"delsermon", id:sid });
    }
  }
});

// A rewritten theme goes to the Themes tab; one put back to the plan's wording
// (or left empty) removes the row, so the plan's own theme shows again.
function saveTheme() {
  const x = M.byId[ui.editTheme], v = document.getElementById("t-text").value.trim();
  ui.editTheme = null;
  if (!x) return render();
  const now = DATA?.themes?.[x.id] || "";
  const want = v === x.theme ? "" : v;
  if (want === now) return render();
  change({ op:"theme", passage:x.id, theme:want });
}
document.addEventListener("keydown", ev => {
  if (ev.target.id === "t-text") {
    if (ev.key === "Enter") { ev.preventDefault(); saveTheme(); }
    if (ev.key === "Escape") { ui.editTheme = null; render(); }
    return;
  }
  const inp = ev.target.closest?.("[data-combo]"); if (!inp) return;
  const menu = inp.parentElement.querySelector(".cmenu"); if (!menu) return;
  const lis = [...menu.children], i = lis.findIndex(li => li.classList.contains("on"));
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    const j = ev.key === "ArrowDown" ? Math.min(i + 1, lis.length - 1) : Math.max(i - 1, 0);
    lis.forEach((li, k) => li.classList.toggle("on", k === j)); lis[j]?.scrollIntoView({ block:"nearest" });
  } else if (ev.key === "Enter" && i >= 0) { ev.preventDefault(); inp.value = lis[i].dataset.v; menu.remove(); }
  else if (ev.key === "Escape") menu.remove();
});

/* Series and Pastor in the sermon form: a pick list of the ones already used
   (most recent first) that still takes any typed text. Focusing shows them
   all; typing narrows the list. */
function comboOpts(kind) {
  const list = (DATA?.sermons || []).slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return [...new Set(list.map(s => String(s[kind] || "").trim()).filter(Boolean))];
}
function showCombo(inp, q) {
  inp.parentElement.querySelector(".cmenu")?.remove();
  const want = q.trim().toLowerCase();
  const opts = comboOpts(inp.dataset.combo).filter(o => !want || o.toLowerCase().includes(want));
  if (!opts.length) return;
  inp.insertAdjacentHTML("afterend", `<ul class="cmenu">${opts.map(o => `<li data-v="${esc(o)}">${esc(o)}</li>`).join("")}</ul>`);
}
document.addEventListener("focusin", ev => { if (ev.target.dataset?.combo) showCombo(ev.target, ""); });
document.addEventListener("input", ev => { if (ev.target.dataset?.combo) showCombo(ev.target, ev.target.value); });
document.addEventListener("focusout", ev => { if (ev.target.dataset?.combo) setTimeout(() => ev.target.parentElement?.querySelector(".cmenu")?.remove(), 150); });
document.addEventListener("mousedown", ev => {
  const li = ev.target.closest(".cmenu li");
  if (li) { ev.preventDefault(); const inp = li.closest(".cmb").querySelector("input"); inp.value = li.dataset.v; li.parentElement.remove(); return; }
  const inp = ev.target.closest("[data-combo]");
  if (inp && document.activeElement === inp && !inp.parentElement.querySelector(".cmenu")) showCombo(inp, "");
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
store.del("esv:pending"); store.del("esv:done");        // the old check marks: the app no longer tracks reading
fetch("plan.json").then(r => r.json()).then(p => {
  PLAN = p; model();
  if (!(ui.g >= 0 && ui.g < PLAN.groups.length)) ui.g = 0;
  render(); sync();
}).catch(() => { PLAN = false; render(); });
</script>
